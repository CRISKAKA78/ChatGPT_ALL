name: Build xfrpc ARM GCC 5.2

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-xfrpc-arm.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Build xfrpc with uploaded OpenWrt toolchain
        id: crossbuild
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/xfrpc-build.log") 2>&1

          sudo apt-get update
          sudo apt-get install -y \
            libc6-i386 lib32stdc++6 lib32gcc-s1 \
            cmake ninja-build make perl git file binutils pkg-config \
            autoconf automake libtool

          WORK="$GITHUB_WORKSPACE/work-xfrpc"
          SRC="$WORK/src"
          DEPS="$WORK/deps"
          OUT="$GITHUB_WORKSPACE/xfrpc-output"
          mkdir -p "$WORK" "$SRC" "$DEPS" "$OUT" "$WORK/toolchain"

          echo '== Reconstruct uploaded GCC 5.2 toolchain =='
          ls -lh gcc-5.2.tar.gz.part_0*
          cat gcc-5.2.tar.gz.part_00 \
              gcc-5.2.tar.gz.part_01 \
              gcc-5.2.tar.gz.part_02 \
              gcc-5.2.tar.gz.part_03 \
              gcc-5.2.tar.gz.part_04 > "$WORK/gcc-5.2.tar.gz"
          gzip -t "$WORK/gcc-5.2.tar.gz"
          tar -xzf "$WORK/gcc-5.2.tar.gz" -C "$WORK/toolchain"

          TC="$WORK/toolchain/gcc-5.2"
          TARGET="arm-openwrt-linux-uclibcgnueabi"
          CROSS="$TC/bin/${TARGET}-"
          CC="${CROSS}gcc"
          AR="${CROSS}ar"
          RANLIB="${CROSS}ranlib"
          STRIP="${CROSS}strip"
          export PATH="$TC/bin:$PATH"

          echo '== Toolchain identity =='
          file "$CC"
          "$CC" --version
          cat "$TC/info.mk"

          cat > "$WORK/hello.c" <<'EOF'
          #include <stdio.h>
          int main(void) { puts("hello"); return 0; }
          EOF
          "$CC" -O2 "$WORK/hello.c" -o "$WORK/hello-arm"
          file "$WORK/hello-arm"
          readelf -h "$WORK/hello-arm"
          readelf -A "$WORK/hello-arm" || true

          echo '== Fetch xfrpc and dependency sources =='
          git clone --depth 1 https://github.com/liudf0716/xfrpc.git "$SRC/xfrpc"
          git -C "$SRC/xfrpc" fetch --depth 1 origin e184e30fd916fae7d7a6a3f91fcc844011180026
          git -C "$SRC/xfrpc" checkout --detach e184e30fd916fae7d7a6a3f91fcc844011180026

          git clone --depth 1 --branch v1.2.13 https://github.com/madler/zlib.git "$SRC/zlib"
          git clone --depth 1 --branch OpenSSL_1_1_1w https://github.com/openssl/openssl.git "$SRC/openssl"
          git clone --depth 1 --branch json-c-0.15-20200726 https://github.com/json-c/json-c.git "$SRC/json-c"
          git clone --depth 1 --branch release-2.1.12-stable https://github.com/libevent/libevent.git "$SRC/libevent"

          cat > "$WORK/arm-toolchain.cmake" <<EOF
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_C_COMPILER "$CC")
          set(CMAKE_AR "$AR")
          set(CMAKE_RANLIB "$RANLIB")
          set(CMAKE_STRIP "$STRIP")
          set(CMAKE_FIND_ROOT_PATH "$DEPS" "$TC")
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          EOF

          JOBS=2

          echo '== Build zlib 1.2.13 =='
          pushd "$SRC/zlib"
          make distclean >/dev/null 2>&1 || true
          CC="$CC" AR="$AR" RANLIB="$RANLIB" \
            CFLAGS='-O2 -pipe' \
            ./configure --prefix="$DEPS" --static
          make -j"$JOBS"
          make install
          popd

          echo '== Build OpenSSL 1.1.1w =='
          pushd "$SRC/openssl"
          ./Configure linux-generic32 \
            no-shared no-tests no-asm no-dso no-engine \
            --prefix="$DEPS" \
            --openssldir=/etc/ssl \
            --cross-compile-prefix="$CROSS"
          make -j"$JOBS"
          make install_sw
          popd

          echo '== Build json-c 0.15 =='
          cmake -S "$SRC/json-c" -B "$SRC/json-c/build-arm" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$WORK/arm-toolchain.cmake" \
            -DCMAKE_INSTALL_PREFIX="$DEPS" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_APPS=OFF \
            -DDISABLE_WERROR=ON \
            -DCMAKE_C_FLAGS='-O2 -pipe'
          cmake --build "$SRC/json-c/build-arm" -- -j"$JOBS"
          cmake --install "$SRC/json-c/build-arm"

          echo '== Build libevent 2.1.12 with OpenSSL =='
          cmake -S "$SRC/libevent" -B "$SRC/libevent/build-arm" -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$WORK/arm-toolchain.cmake" \
            -DCMAKE_INSTALL_PREFIX="$DEPS" \
            -DCMAKE_BUILD_TYPE=Release \
            -DEVENT__LIBRARY_TYPE=STATIC \
            -DEVENT__DISABLE_TESTS=ON \
            -DEVENT__DISABLE_REGRESS=ON \
            -DEVENT__DISABLE_SAMPLES=ON \
            -DEVENT__DISABLE_BENCHMARK=ON \
            -DEVENT__DISABLE_OPENSSL=OFF \
            -DOPENSSL_ROOT_DIR="$DEPS" \
            -DOPENSSL_USE_STATIC_LIBS=TRUE \
            -DCMAKE_C_FLAGS="-O2 -pipe -I$DEPS/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$DEPS/lib"
          cmake --build "$SRC/libevent/build-arm" -- -j"$JOBS"
          cmake --install "$SRC/libevent/build-arm"

          echo '== Dependency inventory =='
          find "$DEPS/lib" -maxdepth 1 -type f -printf '%f\n' | sort

          echo '== Prepare xfrpc for GCC 5.2/static dependency link =='
          cd "$SRC/xfrpc"
          # Build-only compatibility adjustments: do not turn compiler warnings into errors
          # on this old GCC, and put event_openssl before event for static archive resolution.
          sed -i '/^[[:space:]]*-Werror[[:space:]]*$/d' CMakeLists.txt
          sed -i '/target_compile_options(xfrpc PRIVATE -Wno-stringop-truncation)/d' CMakeLists.txt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('CMakeLists.txt')
          s = p.read_text()
          s = s.replace('    event\n    event_openssl\n', '    event_openssl\n    event\n')
          p.write_text(s)
          PY

          echo '== Configure xfrpc =='
          cmake -S . -B build-arm -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$WORK/arm-toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_STANDARD=11 \
            -DUSE_WOLFSSL=OFF \
            -DENABLE_QUIC=OFF \
            -DENABLE_SANITIZER=OFF \
            -DJSON-C_INCLUDE_DIR="$DEPS/include/json-c" \
            -DJSON-C_LIBRARY="$DEPS/lib/libjson-c.a" \
            -DZLIB_INCLUDE_DIR="$DEPS/include" \
            -DZLIB_LIBRARY="$DEPS/lib/libz.a" \
            -DOPENSSL_ROOT_DIR="$DEPS" \
            -DOPENSSL_SSL_LIBRARY="$DEPS/lib/libssl.a" \
            -DOPENSSL_CRYPTO_LIBRARY="$DEPS/lib/libcrypto.a" \
            -DLIBEVENT_INCLUDE_DIR="$DEPS/include" \
            -DLIBEVENT_LIB="$DEPS/lib/libevent.a" \
            -DLIBEVENT_OPENSSL_LIB="$DEPS/lib/libevent_openssl.a" \
            -DCMAKE_C_FLAGS="-O2 -pipe -std=gnu11 -I$DEPS/include -ffunction-sections -fdata-sections" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$DEPS/lib -Wl,--gc-sections"

          echo '== Compile xfrpc =='
          cmake --build build-arm --verbose -- -j"$JOBS"

          cp build-arm/xfrpc "$OUT/xfrpc.unstripped"
          "$STRIP" --strip-unneeded build-arm/xfrpc -o "$OUT/xfrpc"
          sha256sum "$OUT/xfrpc" "$OUT/xfrpc.unstripped" | tee "$OUT/SHA256SUMS"

          {
            echo "xfrpc source commit: $(git rev-parse HEAD)"
            echo "toolchain: $(cat "$TC/info.mk" | tr '\n' ' ')"
            echo 'dependencies: zlib 1.2.13; OpenSSL 1.1.1w; json-c 0.15; libevent 2.1.12-stable'
            echo 'USE_WOLFSSL=OFF ENABLE_QUIC=OFF'
            echo
            file "$OUT/xfrpc"
            echo
            readelf -h "$OUT/xfrpc"
            echo
            readelf -A "$OUT/xfrpc" || true
            echo
            readelf -d "$OUT/xfrpc" || true
          } | tee "$OUT/build-info.txt"

          echo '== Build completed successfully =='

      - name: Collect build log
        if: always()
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/xfrpc-output"
          cp "$GITHUB_WORKSPACE/xfrpc-build.log" "$GITHUB_WORKSPACE/xfrpc-output/xfrpc-build.log" 2>/dev/null || true

      - name: Upload xfrpc build result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xfrpc-arm-cortex-a7-gcc5.2
          path: xfrpc-output/
          if-no-files-found: warn
          retention-days: 3
          compression-level: 6

      - name: Mark job failed when cross build failed
        if: steps.crossbuild.outcome != 'success'
        run: exit 1
