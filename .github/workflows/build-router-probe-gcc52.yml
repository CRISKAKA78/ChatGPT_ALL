name: Build router-probe GCC 5.2

on:
  push:
    branches: [probe-build-temp-fix]
    paths:
      - 'probe-build-input/**'
      - '.github/workflows/build-router-probe-gcc52.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build router-probe
        id: crossbuild
        continue-on-error: true
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee "$GITHUB_WORKSPACE/router-probe-build.log") 2>&1
          sudo apt-get update
          sudo apt-get install -y libc6-i386 lib32stdc++6 lib32gcc-s1 cmake unzip file binutils

          WORK="$GITHUB_WORKSPACE/work-router-probe"
          OUT="$GITHUB_WORKSPACE/router-probe-output"
          mkdir -p "$WORK/toolchain" "$OUT"

          echo '== Reconstruct and verify uploaded source =='
          cat \
            probe-build-input/probe.zip.b64.part_00 \
            probe-build-input/probe.zip.b64.part_01 \
            probe-build-input/probe.zip.b64.fix_00 \
            probe-build-input/probe.zip.b64.fix_01 \
            probe-build-input/probe.zip.b64.fix_02 \
            probe-build-input/probe.zip.b64.part_03 \
            probe-build-input/probe.zip.b64.part_04 \
            | base64 -d > "$WORK/probe.zip"
          echo 'a32a7925f830572bef1892160c6f191321e4c67a3fad5ce95497766c1af4e0ef  '"$WORK/probe.zip" | sha256sum -c -
          test "$(stat -c %s "$WORK/probe.zip")" = '50766'
          unzip -t "$WORK/probe.zip"
          unzip -q "$WORK/probe.zip" -d "$WORK/src"

          echo '== Reconstruct GCC 5.2 toolchain =='
          cat gcc-5.2.tar.gz.part_00 gcc-5.2.tar.gz.part_01 gcc-5.2.tar.gz.part_02 gcc-5.2.tar.gz.part_03 gcc-5.2.tar.gz.part_04 > "$WORK/gcc-5.2.tar.gz"
          gzip -t "$WORK/gcc-5.2.tar.gz"
          tar -xzf "$WORK/gcc-5.2.tar.gz" -C "$WORK/toolchain"
          TC="$WORK/toolchain/gcc-5.2"
          TARGET=arm-openwrt-linux-uclibcgnueabi
          CROSS="$TC/bin/${TARGET}-"
          export PATH="$TC/bin:$PATH"
          export STAGING_DIR="$TC"
          export LIBRARY_PATH="$TC/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          export LDFLAGS="-L$TC/lib -Wl,-rpath-link,$TC/lib"
          "${CROSS}g++" --version
          "${CROSS}g++" -print-search-dirs
          cat "$TC/info.mk"

          cat > "$WORK/router-toolchain.cmake" <<EOF
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_C_COMPILER "${CROSS}gcc")
          set(CMAKE_CXX_COMPILER "${CROSS}g++")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-L$TC/lib -Wl,-rpath-link,$TC/lib")
          set(CMAKE_FIND_ROOT_PATH "$TC")
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          EOF

          echo '== Configure =='
          cmake -S "$WORK/src/probe" -B "$WORK/build" \
            -DCMAKE_TOOLCHAIN_FILE="$WORK/router-toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF

          echo '== Compile =='
          cmake --build "$WORK/build" --parallel 2 --verbose

          BIN="$WORK/build/router-probe"
          test -f "$BIN"
          cp "$BIN" "$OUT/router-probe-arm-gcc5.2-uclibc.unstripped"
          "${CROSS}strip" --strip-unneeded "$BIN" -o "$OUT/router-probe-arm-gcc5.2-uclibc"
          chmod +x "$OUT/router-probe-arm-gcc5.2-uclibc"

          echo '== Verify =='
          file "$OUT/router-probe-arm-gcc5.2-uclibc"
          "${CROSS}readelf" -h "$OUT/router-probe-arm-gcc5.2-uclibc"
          "${CROSS}readelf" -A "$OUT/router-probe-arm-gcc5.2-uclibc" || true
          "${CROSS}readelf" -l "$OUT/router-probe-arm-gcc5.2-uclibc" | grep -E 'INTERP|interpreter' || true
          "${CROSS}readelf" -d "$OUT/router-probe-arm-gcc5.2-uclibc" || true
          sha256sum "$OUT/router-probe-arm-gcc5.2-uclibc" "$OUT/router-probe-arm-gcc5.2-uclibc.unstripped" | tee "$OUT/SHA256SUMS"

          {
            echo 'Source archive SHA256: a32a7925f830572bef1892160c6f191321e4c67a3fad5ce95497766c1af4e0ef'
            echo 'Toolchain: arm-openwrt-linux-uclibcgnueabi GCC 5.2.0 / uClibc-ng 1.0.14'
            echo 'CMake: Release, BUILD_TESTING=OFF'
            echo
            file "$OUT/router-probe-arm-gcc5.2-uclibc"
            echo
            "${CROSS}readelf" -A "$OUT/router-probe-arm-gcc5.2-uclibc" || true
            echo
            "${CROSS}readelf" -d "$OUT/router-probe-arm-gcc5.2-uclibc" || true
          } > "$OUT/build-info.txt"

      - name: Collect log
        if: always()
        run: |
          mkdir -p router-probe-output
          cp router-probe-build.log router-probe-output/ 2>/dev/null || true

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: router-probe-arm-gcc5.2-uclibc
          path: router-probe-output/
          retention-days: 3

      - name: Mark failed
        if: steps.crossbuild.outcome != 'success'
        run: exit 1
