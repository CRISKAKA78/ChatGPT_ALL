name: Build router-probe GCC 5.2

on:
  push:
    branches: [probe-build-temp-fix]
    paths:
      - 'probe-build-input-v2/**'
      - '.github/workflows/build-router-probe-gcc52.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build production router-probe only
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y libc6-i386 lib32stdc++6 lib32gcc-s1 cmake unzip file binutils

          WORK="$GITHUB_WORKSPACE/work-router-probe"
          OUT="$GITHUB_WORKSPACE/router-probe-output"
          mkdir -p "$WORK/toolchain" "$OUT"

          echo '== Reconstruct verified previous source baseline =='
          cat \
            probe-build-input/probe.zip.b64.part_00 \
            probe-build-input/probe.zip.b64.part_01 \
            probe-build-input/probe.zip.b64.fix_00 \
            probe-build-input/probe.zip.b64.fix_01 \
            probe-build-input/probe.zip.b64.fix_02 \
            probe-build-input/probe.zip.b64.part_03 \
            probe-build-input/probe.zip.b64.part_04 \
            | base64 -d > "$WORK/probe-base.zip"
          echo 'a32a7925f830572bef1892160c6f191321e4c67a3fad5ce95497766c1af4e0ef  '"$WORK/probe-base.zip" | sha256sum -c -
          unzip -q "$WORK/probe-base.zip" -d "$WORK/src"

          echo '== Overlay updated production sources =='
          cat \
            probe-build-input-v2/prod-update.b64.part_00 \
            probe-build-input-v2/prod-update.b64.part_01 \
            probe-build-input-v2/prod-update.b64.part_02 \
            | base64 -d > "$WORK/prod-update.tar.gz"
          echo '51540b657568ce05bef1e1af200666a77828a4263f75e6b5800b527df39dfa99  '"$WORK/prod-update.tar.gz" | sha256sum -c -
          tar -xzf "$WORK/prod-update.tar.gz" -C "$WORK/src"

          # Tests are intentionally excluded from this build.
          rm -rf "$WORK/src/probe/tests"

          echo '== Apply GCC 5.2/uClibc compatibility shim =='
          cat > "$WORK/src/probe/include/rmp/gcc52_compat.h" <<'EOF'
          #ifndef RMP_GCC52_COMPAT_H
          #define RMP_GCC52_COMPAT_H
          #include <stdio.h>
          #include <sstream>
          #include <string>
          namespace rmp {
          template <typename T>
          std::string Gcc52ToString(const T& value) {
              std::ostringstream stream;
              stream << value;
              return stream.str();
          }
          }
          #endif
          EOF

          for f in client.cpp file_manager.cpp file_wire.cpp; do
            sed -i '1i #include "rmp/gcc52_compat.h"' "$WORK/src/probe/src/$f"
            sed -i 's/std::to_string/Gcc52ToString/g' "$WORK/src/probe/src/$f"
          done
          sed -i \
            -e 's/std::strtoull/::strtoull/g' \
            -e 's/std::strtoul/::strtoul/g' \
            -e 's/std::strtol/::strtol/g' \
            "$WORK/src/probe/src/"*.cpp

          if grep -R -n -E 'std::to_string|std::strtoull|std::strtoul|std::strtol' "$WORK/src/probe/src"; then
            echo 'ERROR: unpatched GCC 5.2/uClibc compatibility API remains'
            exit 1
          fi

          echo '== Reconstruct GCC 5.2 toolchain =='
          cat gcc-5.2.tar.gz.part_00 gcc-5.2.tar.gz.part_01 gcc-5.2.tar.gz.part_02 gcc-5.2.tar.gz.part_03 gcc-5.2.tar.gz.part_04 > "$WORK/gcc-5.2.tar.gz"
          gzip -t "$WORK/gcc-5.2.tar.gz"
          tar -xzf "$WORK/gcc-5.2.tar.gz" -C "$WORK/toolchain"
          TC="$WORK/toolchain/gcc-5.2"
          TARGET=arm-openwrt-linux-uclibcgnueabi
          CROSS="$TC/bin/${TARGET}-"
          export PATH="$TC/bin:$PATH"
          export STAGING_DIR="$TC"
          export LIBRARY_PATH="$TC/lib${LIBRARY_PATH:+:$LIBRARY_PATH}"
          export LDFLAGS="-L$TC/lib -Wl,-rpath-link,$TC/lib"
          "${CROSS}g++" --version

          cat > "$WORK/router-toolchain.cmake" <<EOF
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR arm)
          set(CMAKE_C_COMPILER "${CROSS}gcc")
          set(CMAKE_CXX_COMPILER "${CROSS}g++")
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-L$TC/lib -Wl,-rpath-link,$TC/lib")
          set(CMAKE_FIND_ROOT_PATH "$TC")
          set(CMAKE_FIND_ROOT_PATH_MODE_PROGRAM NEVER)
          set(CMAKE_FIND_ROOT_PATH_MODE_LIBRARY ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_INCLUDE ONLY)
          set(CMAKE_FIND_ROOT_PATH_MODE_PACKAGE ONLY)
          EOF

          echo '== Configure production build (tests OFF) =='
          cmake -S "$WORK/src/probe" -B "$WORK/build" \
            -DCMAKE_TOOLCHAIN_FILE="$WORK/router-toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF

          echo '== Build router-probe target only =='
          cmake --build "$WORK/build" --target router-probe --parallel 2 --verbose

          BIN="$WORK/build/router-probe"
          test -f "$BIN"
          "${CROSS}strip" --strip-unneeded "$BIN" -o "$OUT/router-probe-arm-gcc5.2-uclibc"
          chmod +x "$OUT/router-probe-arm-gcc5.2-uclibc"

          echo '== Verify final binary =='
          file "$OUT/router-probe-arm-gcc5.2-uclibc"
          "${CROSS}readelf" -h "$OUT/router-probe-arm-gcc5.2-uclibc"
          "${CROSS}readelf" -A "$OUT/router-probe-arm-gcc5.2-uclibc" || true
          "${CROSS}readelf" -l "$OUT/router-probe-arm-gcc5.2-uclibc" | grep -E 'INTERP|interpreter' || true
          "${CROSS}readelf" -d "$OUT/router-probe-arm-gcc5.2-uclibc" || true
          sha256sum "$OUT/router-probe-arm-gcc5.2-uclibc"

      - name: Upload production binary only
        uses: actions/upload-artifact@v4
        with:
          name: router-probe-arm-gcc5.2-uclibc
          path: router-probe-output/router-probe-arm-gcc5.2-uclibc
          if-no-files-found: error
          retention-days: 3
