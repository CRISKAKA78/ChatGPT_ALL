# trigger-2
name: package-gcc-parts

on:
  push:
    paths:
      - '.github/workflows/package-gcc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify parts
        run: |
          ls -lh gcc-5.2.tar.gz.part_0*
          sha256sum gcc-5.2.tar.gz.part_0*
      - name: Upload GCC split parts
        uses: actions/upload-artifact@v4
        with:
          name: gcc-5.2-parts
          path: gcc-5.2.tar.gz.part_0*
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
